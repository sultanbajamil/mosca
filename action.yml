name: MOSCA post-quantum scan
description: >-
  Scan source, configuration, live TLS/SSH/STARTTLS/QUIC/IKEv2 endpoints and
  recorded PCAP captures for post-quantum exposure. Emits CBOM, SARIF, an HTML
  report and dynamic SVG badges, and fails only on findings at or above the
  chosen severity or on regressions against a baseline.
author: sultanbajamil

branding:
  icon: shield
  color: purple

inputs:
  path:
    description: Path to scan.
    required: false
    default: .
  tls:
    description: Comma-separated TLS endpoints to probe.
    required: false
    default: ''
  ssh:
    description: Comma-separated SSH targets to probe (host or host:port).
    required: false
    default: ''
  starttls:
    description: Comma-separated STARTTLS targets (smtp://, imap://, pop3://, postgres://, ldap://).
    required: false
    default: ''
  quic:
    description: Comma-separated QUIC endpoints to probe.
    required: false
    default: ''
  ikev2:
    description: Comma-separated IKEv2 gateways to probe.
    required: false
    default: ''
  pcap:
    description: Comma-separated PCAP/PCAPNG capture files to harvest for recorded TLS and SSH sessions.
    required: false
    default: ''
  badge:
    description: Directory for the generated QRI and HNDL SVG badges. Empty disables badge output.
    required: false
    default: ''
  benchmark-snapshot:
    description: Snapshot file for a reproducible sector readiness benchmark.
    required: false
    default: ''
  compliance:
    description: 'Compliance report: cnsa2, nist-2030, pci-dss, hipaa, all, or empty.'
    required: false
    default: ''
  fail-on-compliance:
    description: 'Standard that fails the job when it does not pass: cnsa2, nist-2030, pci-dss, hipaa, all, or empty.'
    required: false
    default: ''
  baseline:
    description: Baseline file to compare against.
    required: false
    default: ''
  write-baseline:
    description: Write the current findings as a baseline file.
    required: false
    default: ''
  fail-on:
    description: 'Severity that fails the job: low, medium, high, critical, or empty to never fail.'
    required: false
    default: high
  format:
    description: Comma-separated report formats (html,json,cbom,sarif,term,mermaid).
    required: false
    default: html,sarif,json,cbom,mermaid
  out:
    description: Output directory.
    required: false
    default: mosca-report
  node-version:
    description: Node.js version used to run MOSCA.
    required: false
    default: '20'

outputs:
  report:
    description: Path to the generated HTML report.
    value: ${{ steps.scan.outputs.report }}
  badges:
    description: Directory containing mosca-qri-badge.svg and mosca-hndl-badge.svg.
    value: ${{ steps.scan.outputs.badges }}
  benchmark:
    description: Path to the generated benchmark HTML report.
    value: ${{ steps.benchmark.outputs.report }}
  exit-code:
    description: MOSCA process exit code.
    value: ${{ steps.scan.outputs.exit-code }}

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}

    - name: Scan with MOSCA
      id: scan
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_TLS: ${{ inputs.tls }}
        INPUT_SSH: ${{ inputs.ssh }}
        INPUT_STARTTLS: ${{ inputs.starttls }}
        INPUT_QUIC: ${{ inputs.quic }}
        INPUT_IKEV2: ${{ inputs.ikev2 }}
        INPUT_PCAP: ${{ inputs.pcap }}
        INPUT_BADGE: ${{ inputs.badge }}
        INPUT_COMPLIANCE: ${{ inputs.compliance }}
        INPUT_FAIL_ON_COMPLIANCE: ${{ inputs.fail-on-compliance }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_WRITE_BASELINE: ${{ inputs.write-baseline }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_OUT: ${{ inputs.out }}
      run: |
        set +e
        args=(scan "$INPUT_PATH" --format "$INPUT_FORMAT" --out "$INPUT_OUT")
        [ -n "$INPUT_TLS" ] && args+=(--tls "$INPUT_TLS")
        [ -n "$INPUT_SSH" ] && args+=(--ssh "$INPUT_SSH")
        [ -n "$INPUT_STARTTLS" ] && args+=(--starttls "$INPUT_STARTTLS")
        [ -n "$INPUT_QUIC" ] && args+=(--quic "$INPUT_QUIC")
        [ -n "$INPUT_IKEV2" ] && args+=(--ikev2 "$INPUT_IKEV2")
        [ -n "$INPUT_PCAP" ] && args+=(--pcap "$INPUT_PCAP")
        [ -n "$INPUT_BADGE" ] && args+=(--badge "$INPUT_BADGE")
        [ -n "$INPUT_COMPLIANCE" ] && args+=(--compliance "$INPUT_COMPLIANCE")
        [ -n "$INPUT_FAIL_ON_COMPLIANCE" ] && args+=(--fail-on-compliance "$INPUT_FAIL_ON_COMPLIANCE")
        [ -n "$INPUT_BASELINE" ] && args+=(--baseline "$INPUT_BASELINE")
        [ -n "$INPUT_WRITE_BASELINE" ] && args+=(--write-baseline "$INPUT_WRITE_BASELINE")
        [ -n "$INPUT_FAIL_ON" ] && args+=(--fail-on "$INPUT_FAIL_ON")

        node "${{ github.action_path }}/bin/mosca.js" "${args[@]}"
        code=$?
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        echo "report=$INPUT_OUT/mosca-report.html" >> "$GITHUB_OUTPUT"
        echo "badges=$INPUT_BADGE" >> "$GITHUB_OUTPUT"
        exit $code

    - name: Benchmark PQC readiness
      id: benchmark
      if: inputs.benchmark-snapshot != ''
      shell: bash
      env:
        INPUT_SNAPSHOT: ${{ inputs.benchmark-snapshot }}
        INPUT_OUT: ${{ inputs.out }}
      run: |
        node "${{ github.action_path }}/bin/mosca.js" benchmark \
          --snapshot "$INPUT_SNAPSHOT" \
          --out "$INPUT_OUT/benchmark" \
          --format html,json
        echo "report=$INPUT_OUT/benchmark/state-of-pqc.html" >> "$GITHUB_OUTPUT"
