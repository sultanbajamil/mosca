worker_processes auto;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Edge terminator for payments.nimbus.example
    server {
        listen 443 ssl http2;
        server_name payments.nimbus.example;

        ssl_certificate     /etc/ssl/nimbus/fullchain.pem;
        ssl_certificate_key /etc/ssl/nimbus/privkey.pem;

        # Kept for the merchant portal, which still ships an old Android client.
        ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
        ssl_ciphers HIGH:!aNULL:!MD5:RC4-SHA:DES-CBC3-SHA;
        ssl_prefer_server_ciphers on;

        # Classical curve only; the load balancer predates OpenSSL 3.5.
        ssl_ecdh_curve secp256r1;

        location / {
            proxy_pass http://payments_api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # Internal admin surface
    server {
        listen 8443 ssl;
        server_name admin.nimbus.internal;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;

        location / {
            proxy_pass http://admin_api;
        }
    }
}
