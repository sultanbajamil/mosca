name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Zero-dependency guard and tests
        run: npm run check

      - name: Scan the demo estate
        run: node bin/mosca.js demo --quiet --format html,json,cbom,sarif,mermaid --out out

      - name: Validate generated artefacts
        run: node scripts/validate-artifacts.js out

      - name: Verify the package contents
        run: npm pack --dry-run

      - name: Baseline differential smoke test
        shell: bash
        run: |
          mkdir -p baseline-smoke
          printf "const h = require('crypto').createHash('md5');\n" > baseline-smoke/app.js
          node bin/mosca.js scan baseline-smoke --quiet --format json --out baseline-out --write-baseline baseline.json
          printf "const h = require('crypto').createHash('sha1');\n" > baseline-smoke/new.js
          set +e
          node bin/mosca.js scan baseline-smoke --quiet --format json --out baseline-out2 --baseline baseline.json --fail-on critical
          code=$?
          set -e
          test "$code" -eq 1

  self-scan:
    name: self-scan (no critical exposure)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # MOSCA scans its own source. It uses only modern primitives, so a
      # failure here means a rule regressed into a false positive.
      - name: Scan MOSCA with MOSCA
        run: node bin/mosca.js scan . --format json,sarif --out out --fail-on critical
